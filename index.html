<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>nextwiki</title>
    <meta name="description" content="Modern Wikipedia-like knowledge explorer with AI-powered definitions" />
    <meta name="theme-color" content="#F2EBDA" />
    <meta name="color-scheme" content="light dark" />

    <!-- Brand mark: a small temple (pediment and columns) on parchment, in oxblood -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23F2EBDA'/%3E%3Crect x='1' y='1' width='30' height='30' rx='5' fill='none' stroke='%238B2635' stroke-width='1.2'/%3E%3Cg fill='none' stroke='%238B2635' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 12.5L16 6l10 6.5z'/%3E%3Cpath d='M9.5 15.5v8M14 15.5v8M18 15.5v8M22.5 15.5v8'/%3E%3Cpath d='M6 26h20'/%3E%3C/g%3E%3C/svg%3E" />
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dk0f2y0hu/image/upload/v1757687903/Group_1_jo8blc.png" />

    <!-- Apply the saved theme and accent before first paint (no flash) -->
    <script>
      (function () {
        try {
          var d = document.documentElement;
          var theme = localStorage.getItem('theme') || 'light';
          d.setAttribute('data-theme', theme);
          d.classList.add(theme === 'dark' ? 'dark-theme' : 'light-theme');
          d.setAttribute('data-accent-color', localStorage.getItem('accentColor') || 'default');
          var lang = localStorage.getItem('language');
          if (lang) d.setAttribute('lang', lang);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', theme === 'dark' ? '#151210' : '#F2EBDA');
        } catch (e) {}
      })();
    </script>

    <!-- Typefaces: Cormorant Garamond (display), EB Garamond (reading text), Cinzel (inscriptions) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=EB+Garamond:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
