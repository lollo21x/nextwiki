<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>nextwiki</title>
    <meta name="description" content="Modern Wikipedia-like knowledge explorer with AI-powered definitions" />
    <meta name="theme-color" content="#EAEFF1" />
    <meta name="color-scheme" content="light dark" />

    <!-- Brand mark: an "n" with a node, drawn to match the in-app logo -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%230E1B26'/%3E%3Cg fill='none' stroke='%231CC8EE' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M9 24V13'/%3E%3Cpath d='M9 18c0-3.2 2.6-5 6-5s6 1.8 6 5v6'/%3E%3C/g%3E%3Ccircle cx='24' cy='8' r='2.4' fill='%231CC8EE'/%3E%3C/svg%3E" />
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dk0f2y0hu/image/upload/v1757687903/Group_1_jo8blc.png" />

    <!-- Apply the saved theme and accent before first paint (no flash) -->
    <script>
      (function () {
        try {
          var d = document.documentElement;
          var theme = localStorage.getItem('theme') || 'light';
          d.setAttribute('data-theme', theme);
          d.classList.add(theme === 'dark' ? 'dark-theme' : 'light-theme');
          d.setAttribute('data-accent-color', localStorage.getItem('accentColor') || 'default');
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', theme === 'dark' ? '#0A111A' : '#EAEFF1');
        } catch (e) {}
      })();
    </script>

    <!-- Typefaces: Familjen Grotesk (interface and display), Literata (reading text) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
